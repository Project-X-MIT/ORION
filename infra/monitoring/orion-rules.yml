groups:
  - name: orion-slo
    rules:
      - alert: OrionApiDown
        expr: up{job="orion-api"} == 0
        for: 2m
        labels: { severity: page, owner: platform }
        annotations:
          runbook: docs/runbooks/api-degradation.md
      - alert: OrionWorkerBacklog
        expr: orion_outbox_pending_events > 100
        for: 10m
        labels: { severity: page, owner: platform }
        annotations:
          runbook: docs/runbooks/worker-backlog.md
      - alert: OrionRatingReconciliation
        expr: orion_rating_reconciliation_failures_total > 0
        for: 5m
        labels: { severity: page, owner: data }
        annotations:
          runbook: docs/runbooks/rating-reconciliation.md
      - alert: OrionBackupStale
        expr: orion_backup_age_seconds > orion_backup_max_age_seconds
        for: 1m
        labels: { severity: page, owner: data }
        annotations:
          runbook: docs/runbooks/database-recovery.md
      - alert: OrionBackupFailure
        expr: orion_backup_failure == 1
        for: 0m
        labels: { severity: page, owner: data }
        annotations:
          runbook: docs/runbooks/database-recovery.md
      - alert: OrionRestoreTestMissing
        expr: orion_backup_restore_test_success == 0
        for: 0m
        labels: { severity: warning, owner: data }
        annotations:
          runbook: docs/runbooks/database-recovery.md
