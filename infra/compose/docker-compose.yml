name: orion-local

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "orion-local-redis"]
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "orion-local-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: development
      API_BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: postgres://orion:orion@postgres:5432/orion
      DATABASE_MAX_CONNECTIONS: 10
      REDIS_URL: redis://:orion-local-redis@redis:6379
      SESSION_TTL_SECONDS: 86400
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REQUEST_TIMEOUT_SECONDS: 30
      SHUTDOWN_TIMEOUT_SECONDS: 15
      RUST_LOG: orion_api=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [backend]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://orion:orion@postgres:5432/orion
      DATABASE_MAX_CONNECTIONS: 10
      WORKER_POLL_INTERVAL_SECONDS: 5
      WORKER_RUNNING_LEASE_SECONDS: 300
      SHUTDOWN_TIMEOUT_SECONDS: 15
      RUST_LOG: orion_worker=info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    networks: [backend, edge]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
