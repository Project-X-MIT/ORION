name: orion-production

services:
  api:
    image: ${ORION_API_IMAGE:?set ORION_API_IMAGE to an immutable signed image}
    environment:
      APP_ENV: production
      API_BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from the secret manager}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL from the secret manager}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-30}
      RUST_LOG: ${RUST_LOG:-orion_api=info,tower_http=info}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 6
    networks: [backend]

  worker:
    image: ${ORION_WORKER_IMAGE:?set ORION_WORKER_IMAGE to an immutable signed image}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from the secret manager}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_RUNNING_LEASE_SECONDS: ${WORKER_RUNNING_LEASE_SECONDS:-300}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-30}
      RUST_LOG: ${RUST_LOG:-orion_worker=info}
    networks: [backend]

  frontend:
    image: ${ORION_FRONTEND_IMAGE:?set ORION_FRONTEND_IMAGE to an immutable signed image}
    environment:
      ORION_DOMAIN: ${ORION_DOMAIN:?set ORION_DOMAIN for automatic HTTPS}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, edge]

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
