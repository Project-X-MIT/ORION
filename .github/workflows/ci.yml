name: CI

on:
  pull_request:
  push:
    branches: [main, "Shaurya's-Branch"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # npm 10 can omit platform-specific optional packages when the lockfile
      # was generated on another architecture. Restore the exact Rollup
      # package version referenced by the lockfile before running Vite/Vitest.
      - name: Restore Linux Rollup optional dependency
        run: npm install --no-save --package-lock=false --ignore-scripts @rollup/rollup-linux-x64-gnu@4.62.4
      - run: npm run lint --workspace frontend
      - run: npm run type-check --workspace frontend
      - run: npm test --workspace frontend -- --run
      - run: npm run build --workspace frontend

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test -p orion-common -p orion-domain -p orion-redis --locked
      - run: git diff --check
      - run: test -s Cargo.lock
      - run: test -s frontend/package-lock.json

  containers:
    name: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose files
        run: |
          docker compose -f infra/compose/docker-compose.yml config --quiet
          ORION_API_IMAGE=example.invalid/orion-api@sha256:$(printf '%064d' 0) \
          ORION_WORKER_IMAGE=example.invalid/orion-worker@sha256:$(printf '%064d' 0) \
          ORION_FRONTEND_IMAGE=example.invalid/orion-frontend@sha256:$(printf '%064d' 0) \
          DATABASE_URL=postgres://orion:orion@db/orion \
          REDIS_URL=redis://redis:6379 \
          CORS_ALLOWED_ORIGINS=https://orion.example.com \
          ORION_DOMAIN=orion.example.com \
          docker compose -f infra/compose/docker-compose.prod.yml config --quiet
      - name: Build and smoke test local stack
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f infra/compose/docker-compose.yml)
          cleanup() { "${compose[@]}" down --volumes --remove-orphans; }
          trap cleanup EXIT
          "${compose[@]}" up --build --detach
          curl --fail --retry 30 --retry-delay 2 http://127.0.0.1:5173/health/live
          "${compose[@]}" ps
          "${compose[@]}" stop api worker frontend
